<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Simple marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 6 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="30" y="40" fill="#000000" font-size="18" font-weight="bold">Fluxo de Dados Paralelo (Datapath)</text>

  <!-- ================= INPUTS & CONSTANTS ================= -->
  <g transform="translate(10, 80)">
    <!-- a -->
    <rect x="50" y="0" width="65" height="25" rx="3" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="82.5" y="17" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">a</text>
    
    <!-- b -->
    <rect x="130" y="0" width="65" height="25" rx="3" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="162.5" y="17" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">b</text>
    
    <!-- c -->
    <rect x="210" y="0" width="65" height="25" rx="3" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="242.5" y="17" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    
    <!-- 0 -->
    <rect x="670" y="0" width="65" height="25" rx="3" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="702.5" y="17" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">0</text>
    
    <!-- 3 -->
    <rect x="750" y="0" width="65" height="25" rx="3" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="782.5" y="17" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    
    <!-- 6 -->
    <rect x="830" y="0" width="65" height="25" rx="3" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="862.5" y="17" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">6</text>
  </g>


  <!-- ================= ULA 1 PATH (LEFT) ================= -->
  <g transform="translate(40, 160)">
    <!-- MUX 11 -->
    <polygon points="10,0 180,0 160,35 30,35" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="95" y="22" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">MUX 11</text>

    <!-- MUX 12 -->
    <polygon points="210,0 380,0 360,35 230,35" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="295" y="22" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">MUX 12</text>

    <!-- ULA 1 -->
    <!-- Wedged block -->
    <path d="M 60 80 L 175 80 L 190 95 L 205 80 L 320 80 L 290 140 L 90 140 Z" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="190" y="115" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">ULA 1</text>
    
    <!-- MUX -> ULA lines -->
    <path d="M 95 35 L 95 60 L 130 60 L 130 80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 295 35 L 295 60 L 250 60 L 250 80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- ULA 1 -> Reg 1 -->
    <path d="M 190 140 L 190 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Reg 1 -->
    <rect x="120" y="200" width="140" height="40" rx="2" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="190" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Reg 1</text>
  </g>


  <!-- ================= ULA 2 PATH (RIGHT) ================= -->
  <g transform="translate(520, 160)">
    <!-- MUX 21 -->
    <polygon points="10,0 180,0 160,35 30,35" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="95" y="22" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">MUX 21</text>

    <!-- MUX 22 -->
    <polygon points="210,0 380,0 360,35 230,35" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="295" y="22" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">MUX 22</text>

    <!-- ULA 2 -->
    <!-- Wedged block -->
    <path d="M 60 80 L 175 80 L 190 95 L 205 80 L 320 80 L 290 140 L 90 140 Z" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="190" y="115" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">ULA 2</text>
    
    <!-- MUX -> ULA lines -->
    <path d="M 95 35 L 95 60 L 130 60 L 130 80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 295 35 L 295 60 L 250 60 L 250 80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- ULA 2 -> Reg 2 -->
    <path d="M 190 140 L 190 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Reg 2 -->
    <rect x="120" y="200" width="140" height="40" rx="2" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
    <text x="190" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Reg 2</text>
  </g>


  <!-- ================= FEEDBACK LOOPS ================= -->
  <!-- Feedback Reg 1 -> MUXes -->
  <!-- Reg 1 bottom is at y=400 (200 + 160 + 40). We route it back up to Mux inputs -->
  <path d="M 230 400 L 230 430 L 20 430 L 20 140 L 115 140 L 115 160" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />

  <!-- Feedback Reg 2 -> MUXes -->
  <!-- Reg 2 bottom is at y=400 (200 + 160 + 40). We route it back up -->
  <path d="M 710 400 L 710 440 L 980 440 L 980 140 L 635 140 L 635 160" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />


  <!-- ================= FINAL OUTPUT ================= -->
  <path d="M 230 400 L 230 460" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="200" y="460" width="60" height="25" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="230" y="476" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">result</text>
</svg>