<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Simple marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 6 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="30" y="40" fill="#000000" font-size="18" font-weight="bold">Fluxo de Dados Serial (Datapath)</text>

  <!-- ================= INPUTS & CONSTANTS ================= -->
  <!-- a -->
  <rect x="50" y="80" width="70" height="30" rx="4" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="85" y="100" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">a</text>
  
  <!-- b -->
  <rect x="140" y="80" width="70" height="30" rx="4" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="175" y="100" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">b</text>
  
  <!-- c -->
  <rect x="230" y="80" width="70" height="30" rx="4" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="265" y="100" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">c</text>
  
  <!-- 0 -->
  <rect x="420" y="80" width="70" height="30" rx="4" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="455" y="100" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">0</text>
  
  <!-- 3 -->
  <rect x="510" y="80" width="70" height="30" rx="4" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="545" y="100" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  
  <!-- 6 -->
  <rect x="600" y="80" width="70" height="30" rx="4" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="635" y="100" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">6</text>


  <!-- Buses from Inputs to Muxes -->
  <!-- a -->
  <path d="M 85 110 L 85 150 L 170 150 L 170 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 85 150 L 520 150 L 520 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- b -->
  <path d="M 175 110 L 175 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 175 140 L 540 140 L 540 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- c -->
  <path d="M 265 110 L 265 130 L 200 130 L 200 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 265 130 L 560 130 L 560 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 0 -->
  <path d="M 455 110 L 455 135 L 290 135 L 290 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 455 135 L 630 135 L 630 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3 -->
  <path d="M 545 110 L 545 125 L 310 125 L 310 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 545 125 L 650 125 L 650 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 6 -->
  <path d="M 635 110 L 635 118 L 330 118 L 330 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 635 118 L 670 118 L 670 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- ================= MULTIPLEXERS ================= -->
  <!-- MUX 1 -->
  <polygon points="120,180 370,180 340,225 150,225" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="245" y="208" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">MUX 1</text>

  <!-- MUX 2 -->
  <polygon points="470,180 720,180 690,225 500,225" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="595" y="208" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">MUX 2</text>


  <!-- ================= ALU / ULA ================= -->
  <!-- Outputs of MUXes to ULA inputs -->
  <path d="M 245 225 L 245 270 L 315 270 L 315 290" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 595 225 L 595 270 L 485 270 L 485 290" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ULA Shape -->
  <!-- Top line: (280, 290) to (520, 290) with indent in center.
       Bottom line: (330, 350) to (470, 350) -->
  <path d="M 280 290 L 385 290 L 400 305 L 415 290 L 520 290 L 470 350 L 330 350 Z" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="400" y="325" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">ULA</text>


  <!-- ================= REGISTERS ================= -->
  <!-- ULA output line splits to both registers -->
  <path d="M 400 350 L 400 380" fill="none" stroke="#000000" stroke-width="1.5" />
  
  <!-- Split left to Reg 1 -->
  <path d="M 400 380 L 210 380 L 210 405" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Split right to Reg 2 -->
  <path d="M 400 380 L 590 380 L 590 405" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Register 1 -->
  <rect x="150" y="405" width="120" height="40" rx="2" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="210" y="429" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Reg 1</text>

  <!-- Register 2 -->
  <rect x="530" y="405" width="120" height="40" rx="2" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="590" y="429" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Reg 2</text>


  <!-- ================= FEEDBACK LOOPS ================= -->
  <!-- Reg 1 back to Muxes -->
  <path d="M 210 445 L 210 480 L 20 480 L 20 160 L 230 160 L 230 180" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <path d="M 20 160 L 20 145 L 580 145 L 580 180" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />

  <!-- Reg 2 back to Muxes -->
  <path d="M 590 445 L 590 490 L 780 490 L 780 170 L 250 170 L 250 180" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <path d="M 780 170 L 780 155 L 600 155 L 600 180" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />


  <!-- ================= FINAL OUTPUT ================= -->
  <path d="M 210 445 L 210 485" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="180" y="485" width="60" height="25" fill="#f3f4f6" stroke="#000000" stroke-width="1.5" />
  <text x="210" y="501" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">result</text>
</svg>